# Alembic 配置（合并版工作台表，P1）
# 注意：这里【不】写死 sqlalchemy.url —— 数据库文件路径由 EXAM_TRACKER_DIR
# 环境变量决定，env.py 直接复用 app.db.models 的 engine，保证与应用运行时
# 指向同一个库文件。用法（在 backend/ 目录）：
#   EXAM_TRACKER_DIR=<隔离数据目录> ../.venv311/bin/alembic upgrade head
[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# sqlalchemy.url 留空：见 env.py（从 app.db.models 的 engine 取）
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
